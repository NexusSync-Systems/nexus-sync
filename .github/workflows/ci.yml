name: "🚀 Pipeline: Build & Deploy"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:  # Umožní ruční spuštění z GitHub UI nebo CLI
    inputs:
      plne_mereni:
        description: 'Změřit E2E testy přes VŠECHNY prohlížeče (trvá desítky minut)'
        type: boolean
        default: false

  # ── Týdenní měření přes všechny prohlížeče ────────────────────────────────
  #
  # Brána pouští všechny specifikace, ale jen na chromiu, aby se každý PR
  # nezdržel. Měřeno 5. 11. 2026: plná matice trvá 41 minut proti 8–11
  # u chromia, a `deploy-backend` na té úloze visí — zapnout ji do brány by
  # odložilo každé nasazení o půl hodiny. To by skončilo stejně jako ruční
  # výčet, který tahle změna ruší: někdo by to zase zúžil.
  #
  # Pokrytí přes prohlížeče se proto přesouvá sem. Žádné nasazení se přitom
  # nespustí — všechny nasazovací úlohy chtějí `push` nebo `workflow_dispatch`,
  # a `schedule` není ani jedno. Ověřeno nad podmínkami všech 14 úloh.
  schedule:
    - cron: '13 3 * * 1'   # pondělí 3:13 UTC, mimo špičku i mimo :00

# Cancel any in-progress run for the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Secret scan
        run: npm run security:secrets

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Generate Prisma Client
        run: cd server && npx prisma generate

      - name: Lint server
        run: cd server && npm run lint -- --quiet

      - name: Run Relay auth/security regression tests
        run: cd server && npm run test:security

      # `test:ci` místo `test`: je to tentýž jest, jen s `--coverage`.
      # Skript existoval od začátku, ale CI volalo variantu bez pokrytí, takže
      # se pokrytí neměřilo vůbec (docs/audit-testu-a-ci.md, nález 3).
      #
      # Práh se ZÁMĚRNĚ nenastavuje. Nejdřív se musí vědět, kde jsme; práh
      # určený od stolu udělá z CI překážku, kterou lidi začnou obcházet.
      - name: Run server tests
        run: cd server && npm run test:ci -- --coverageReporters=json-summary --coverageReporters=text-summary

      - name: Souhrn pokrytí do shrnutí úlohy
        if: always()
        run: |
          SOUHRN=server/coverage/coverage-summary.json
          if [ ! -f "$SOUHRN" ]; then
            echo "### Pokrytí serveru" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Soubor s pokrytím nevznikl — testy nejspíš spadly dřív." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node -e '
            const c = require("./server/coverage/coverage-summary.json").total;
            const r = (k) => `| ${k} | ${c[k].pct} % | ${c[k].covered} / ${c[k].total} |`;
            console.log("### Pokrytí serveru");
            console.log("");
            console.log("| | podíl | pokryto |");
            console.log("| --- | --- | --- |");
            for (const k of ["statements", "branches", "functions", "lines"]) console.log(r(k));
            console.log("");
            console.log("_Práh zatím nastavený není — tohle je výchozí měření._");
          ' >> "$GITHUB_STEP_SUMMARY"

  # Hlídač schema driftu: postaví DB POUZE z migrací a ověří, že odpovídá
  # schema.prisma. Dřív se schéma nasazovalo přes `db push`, takže migrace
  # zůstaly pozadu (chybělo 5 tabulek vč. RefreshToken/ApiKey) a prostředí
  # postavené ze zdrojáku bylo rozbité. Tenhle job to zachytí hned v PR.
  schema-drift:
    name: Schema Drift Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: driftcheck
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    # Heslo držíme zvlášť a URL skládáme až za běhu — connection string s heslem
    # natvrdo by (správně) spustil secret scan, i když jde o zahazovací CI databázi.
    env:
      PGPASSWORD_CI: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Build database URL
        run: echo "DATABASE_URL=postgresql://postgres:${PGPASSWORD_CI}@localhost:5432/driftcheck" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Apply migrations to an empty database
        run: cd server && npx prisma migrate deploy

      - name: Fail if migrations don't match schema.prisma
        run: |
          cd server
          if ! npx prisma migrate diff \
              --from-url "$DATABASE_URL" \
              --to-schema-datamodel prisma/schema.prisma \
              --exit-code > /dev/null 2>&1; then
            echo "::error::Migrace neodpovídají schema.prisma — schéma bylo nejspíš změněno přes 'prisma db push' bez migrace."
            echo "Chybějící změny (SQL, který by DB dorovnal na schéma):"
            npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --script
            exit 1
          fi
          echo "OK: databáze postavená z migrací odpovídá schema.prisma"

  build-client:
    name: Build Client
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: cd client && npm install --legacy-peer-deps

      - name: Lint client
        run: cd client && npm run lint

      # t() vrací při chybějícím klíči SÁM KLÍČ, takže se uživateli zobrazí
      # třeba „inventorySystem". Nic to nenahlásí — ani lint, ani build, ani
      # konzole. V srpnu 2026 takhle chybělo 75 klíčů, mimo jiné pět nadpisů
      # stránek. Skript má vlastní kontrolní vzorek: když se rozbije sám,
      # skončí kódem 2, ne tichým „0 chybějících".
      # Klientské testy (vitest) v CI dlouho neběžely vůbec — job dělal lint,
      # překlady, CSS a build, ale `npm run test` v něm nebyl. Testy tedy
      # existovaly a nikdo je nespouštěl.
      - name: Run client unit tests
        run: cd client && npm run test

      - name: Check translation keys
        run: cd client && npm run check:translations

      # Nedefinovaná var() se taky nikde nenahlásí — u color: se zdědí barva
      # rodiče, u background: vyjde průhledná. V srpnu 2026 takhle nefungovalo
      # 72 zápisů a varovné stavy nebyly červené.
      - name: Check CSS variables
        run: cd client && npm run check:css-vars

      - name: Build client
        run: |
          cd client
          export VITE_APP_VERSION="v$(node -p "require('./package.json').version")-b${{ github.run_number }}"
          npx vite build

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    # Běh trvá běžně 8–11 minut. Bez tohohle limitu platí výchozích šest hodin
    # a úloha, která se na něčem zasekne, drží runner celé odpoledne, místo
    # aby řekla, že něco není v pořádku. (Stalo se to 4. 8. 2026, kdy testy
    # ještě mířily na produkční API a to přestalo odpovídat.)
    #
    # Při `plne_mereni` je limit vyšší: plná matice přes čtyři prohlížeče nad
    # 172 testy se do 25 minut nevejde. Limit ÚLOHY ji zruší a `continue-on-error`
    # na kroku proti tomu nechrání — výsledkem by byla zabitá úloha, nespuštěný
    # souhrn a ŽÁDNÉ měření, tedy přesný opak záměru.
    timeout-minutes: ${{ ((github.event_name == 'workflow_dispatch' && inputs.plne_mereni) || github.event_name == 'schedule') && 90 || 25 }}

    # Backend si zvedáme vlastní, zahazovací.
    #
    # Dřív testy `rbac` a `sms-relay` mířily na PRODUKČNÍ API (výchozí hodnota
    # v tests/helpers/api.js) a skutečně tam zapisovaly — každý PR zakládal
    # v ostré databázi testovací vazby zařízení a testovací SMS. Navíc se tím
    # neověřoval kód z PR, ale to, co je zrovna nasazené.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexus_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      # Hodnoty jsou schválně zahazovací a veřejné — databáze i server žijí
      # jen po dobu běhu úlohy a nejsou odnikud dostupné. Heslo držíme zvlášť
      # a URL skládáme za běhu, aby connection string nespustil secret scan.
      PGPASSWORD_CI: postgres
      NODE_ENV: test
      JWT_SECRET: ci-e2e-jwt-secret-nejmene-32-znaku-dlouhy
      DEVICE_SECRET: devicesecret12345
      NEXUS_DEVICE_SECRET: devicesecret12345
      # app.js odmítne nastartovat bez těchhle tří (min. 32/16/32 znaků).
      ENCRYPTION_KEY: ci-e2e-encryption-key-nejmene-32-znaku
      # Sem míří testy proti živému API místo na produkci.
      NEXUS_API_URL: http://localhost:3000/api
      # Zapéká se do buildu klienta, ze kterého `tests/helpers/mocks.js`
      # servíruje SPA (`client/dist`). Bez ní by `API_BASE` zůstal prázdný,
      # požadavky by přišly o předponu `/api`, mock by na ně nesedl a SPA
      # handler by místo JSONu vrátil index.html.
      #
      # MUSÍ BÝT https a NESMÍ to být localhost. Stránka se testům servíruje
      # z `https://…` (viz baseURL v playwright.config.js) a WebKit blokuje
      # smíšený obsah v rendereru — tedy DŘÍV, než se požadavek dostane
      # k Playwright mockům. S `http://localhost:3000/api` tu padlo 40 testů
      # ve webkitu a 0 v ostatních prohlížečích; chromium, firefox i mobile
      # prošly všechny.
      #
      # `.invalid` je podle RFC 2606 vyhrazená a nikdy se nepřeloží, takže
      # požadavek, který mockům unikne, selže nahlas místo aby šel na cizí
      # stroj. Veškerý provoz v těchto testech je mockovaný; tahle adresa
      # se nemá nikdy otevřít.
      VITE_API_URL: https://nexus-e2e.invalid/api

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('client/package-lock.json') }}

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps --prefer-offline --no-audit
          cd client && npm install --legacy-peer-deps --prefer-offline --no-audit

      # Vlastní limit, kratší než limit celé úlohy.
      #
      # `--with-deps` stahuje apt balíčky z ubuntu mirroru a ten se občas
      # zadrhne — 27. 10. 2026 trval tenhle krok přes 20 minut a sebral celý
      # rozpočet úlohy, takže testy se vůbec nespustily a ve výsledku stálo
      # jen „timed out". S limitem tady spadne krok, který za to může, a je
      # z běhu poznat, že šlo o stahování, ne o regresi.
      #
      # Instalují se VŠECHNY prohlížeče schválně: test:all:e2e nemá
      # --project, takže běží i firefox a webkit (viz playwright.config.js).
      # Zúžit instalaci na chromium by ty dva projekty shodilo.
      - name: Install Playwright Browsers and system dependencies
        timeout-minutes: 15
        run: npx playwright install --with-deps

      # BEZ TOHOHLE KROKU TESTUJE CI NASAZENOU PRODUKCI, NE TENHLE PR.
      #
      # tests/helpers/mocks.js servíruje frontend z client/dist. Ten je
      # v .gitignore, takže v CI po checkoutu neexistuje — mock soubor nenajde,
      # požadavek propadne dál a skončí na nasazeném webu. Testy pak procházely
      # bez ohledu na to, co je v PR, a žádnou frontendovou regresi zachytit
      # nemohly.
      - name: Build client for e2e
        run: cd client && npm run build

      # ── Zahazovací backend pro testy proti živému API ──────────────────────

      - name: Build database URL
        run: echo "DATABASE_URL=postgresql://postgres:${PGPASSWORD_CI}@localhost:5432/nexus_e2e" >> "$GITHUB_ENV"

      - name: Prepare database
        run: |
          cd server
          npm install --prefer-offline --no-audit
          npx prisma generate
          npx prisma migrate deploy
          # Seed zakládá přesně ty účty, které testy používají
          # (owner@nexus.sync, jan@, alice@ …) — viz tests/helpers/api.js.
          # Skript se jmenuje prisma:seed; samotné "seed" v package.json je
          # konfigurace Prismy pro `prisma db seed`, ne npm skript.
          npm run prisma:seed

      - name: Start backend
        run: |
          cd server
          nohup node src/index.js > "$RUNNER_TEMP/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"

      # Server startuje déle než nulu sekund a testy, které nemají kam se
      # připojit, se zaseknou na spojení místo aby řekly proč. Čeká se aktivně
      # a s limitem, ať je z výpadku hlášená chyba, ne dvacet minut ticha.
      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 -o /dev/null http://localhost:3000/api/health; then
              echo "Backend odpovídá po ${i} pokusech."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Zahazovací backend nenastartoval do 60 s."
          cat "$RUNNER_TEMP/server.log" || true
          exit 1

      # Úmyslně to shodí celý běh: RBAC a relay jsou bezpečnostní testy
      # a neproběhlá kontrola není totéž co kontrola v pořádku.
      #
      # PŘEKRYV S HLAVNÍM BĚHEM JE VĚDOMÝ. Od chvíle, kdy hlavní běh pouští
      # všechny specifikace, je těchhle 47 testů v obou krocích — změřeno,
      # ne odhadnuto. Zůstává to tak schválně: tenhle krok běží DŘÍV a shodí
      # běh hned, místo aby se bezpečnostní regrese ukázala až po deseti
      # minutách mezi ostatními.
      #
      # Cena je asi 2–3 minuty navíc. Alternativa by byla vyloučit je
      # z hlavního běhu — tedy zavést druhý ruční seznam, přesně to, co
      # tahle změna ruší.
      - name: Run API relay/security tests
        run: npm run test:api

      # Log serveru je jediné, z čeho jde poznat, proč test proti živému API
      # spadl — bez něj zbývá jen stavový kód odpovědi.
      - name: Backend log
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/server.log" || true

      - name: Run Playwright tests
        run: npm run test:all:e2e
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL || 'https://nexus-sync-8d50b.web.app' }}

      # Bez tohohle bylo u zčervenalé úlohy vidět jen její jméno a co přesně
      # padlo se zjišťovalo projetím logu. Viz docs/audit-testu-a-ci.md, nález 4.
      # `continue-on-error`: krok, který jen vypisuje, nemá nikdy shodit běh,
      # kterému testy prošly.
      - name: Souhrn E2E do shrnutí úlohy
        if: always()
        continue-on-error: true
        run: |
          node scripts/shrnuti-testu.js \
            test-results/playwright-results.json \
            "E2E testy, které CI spouští" >> "$GITHUB_STEP_SUMMARY"

      # ── Měření, ne brána ────────────────────────────────────────────────
      #
      # `test:all:e2e` je ruční výčet 13 souborů, ale v `tests/` jich je 38:
      # 118 ze 164 testů se tedy nikdy nespustí (docs/audit-testu-a-ci.md,
      # nález 1). Nejsou vyřazené schválně — jen se do výčtu nikdy nedopsaly.
      #
      # Než je půjde zapojit, musí se vědět, kolik z nich vůbec prochází.
      # Zapnout je naslepo by znamenalo trvale červené CI, a na červenou se
      # přestane koukat — to je horší než dnešek.
      #
      # Proto `continue-on-error`: tenhle krok NIC neblokuje, jen měří.
      # Jen na masteru a jen chromium, aby to nezdržovalo každý PR.
      #
      # Bez výčtu souborů schválně: testDir je `./tests` a android si projekty
      # pro prohlížeče ignorují samy, takže `playwright test` vezme všechno.
      # Čtvrtý ruční seznam téhož by byl přesně ta vada, kterou audit vytýká.
      - name: Změřit i testy, které v CI neběží
        if: always() && (github.ref == 'refs/heads/master' || inputs.plne_mereni || github.event_name == 'schedule')
        continue-on-error: true
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL || 'https://nexus-sync-8d50b.web.app' }}
          PLNE_MERENI: ${{ inputs.plne_mereni || github.event_name == 'schedule' }}
        run: |
          # Reportér i výstupní adresář se přepisují na příkazové řádce, ne
          # proměnnou prostředí. `playwright.config.js` má u json reportéru
          # pevné `outputFile: test-results/playwright-results.json`, které má
          # před PLAYWRIGHT_JSON_OUTPUT_NAME přednost — měření by tedy přepsalo
          # report hlavního běhu, a to ještě PŘED tím, než se nahraje jako
          # artefakt. V artefaktu by pak byly výsledky měření místo toho, co
          # se po spadlém testu hledá.
          #
          # `--reporter=json` z příkazové řádky nahradí reportéry z konfigurace
          # celé, takže JSON jde na stdout a odsud do vlastního souboru.
          # `--output` odděluje i trasy a snímky.
          #
          # Výsledek jde do `test-results/`, protože ten adresář se nahrává
          # jako artefakt. V kořeni repozitáře by zůstal jen v souhrnu úlohy,
          # a ten se přes API přečíst nedá — tedy měření, ke kterému se nikdo
          # jiný než člověk s prohlížečem nedostane.
          #
          # `--retries=0` schválně: zajímá mě, co projde napoprvé. Opakování
          # by nestabilní testy schovalo mezi zelené, a to je přesně ten údaj,
          # kvůli kterému se to měří.
          #
          # ── Proč chromium, a kdy všechny prohlížeče ──────────────────────
          #
          # Běžně se měří jen na chromiu. Důvod není šetrnost, ale závislosti:
          # `sync-backend` čeká na `e2e-tests` a `deploy-backend` na něj, takže
          # delší měření uvnitř téhle úlohy zdrží KAŽDÉ nasazení. Projekty jsou
          # čtyři (chromium, mobile, firefox, webkit) a 172 testů přes všechny
          # je řádově desítky minut.
          #
          # Jenže chromium samo nestačí na rozhodnutí, co zapnout do bránící
          # sady: 4. 11. 2026 jsem v tomhle repozitáři vyrobil chybu, která
          # padala VÝHRADNĚ na WebKitu (blokovaný smíšený obsah). Chromium ji
          # nechytilo.
          #
          # Plná matice běží ve dvou případech:
          #
          #   - KAŽDÉ PONDĚLÍ automaticky (`schedule`). Nasazení se přitom
          #     nespustí, protože všechny nasazovací úlohy chtějí `push`
          #     nebo `workflow_dispatch`.
          #   - RUČNĚ přes „Run workflow" s volbou `plne_mereni`, když je
          #     potřeba výsledek dřív.
          #
          # RUČNÍ SPOUŠTĚJ Z VĚTVE, NE Z MASTERU. Nasazovací úlohy mají
          # v podmínce `github.ref == 'refs/heads/master'` spolu
          # s `workflow_dispatch`, takže dispatch z masteru by nasazení
          # spustil a čekal by na tuhle úlohu — tedy hodina zdržení.
          # U `schedule` tenhle problém není.
          if [ "${PLNE_MERENI:-false}" = "true" ]; then
            echo "Měření přes VŠECHNY prohlížeče (ruční spuštění)."
            PROJEKTY=""
          else
            echo "Měření jen na chromiu. Plnou matici spustíš ručně s volbou plne_mereni."
            PROJEKTY="--project=chromium"
          fi

          # shellcheck disable=SC2086
          npx playwright test $PROJEKTY --retries=0 \
            --reporter=json --output=test-results-mereni \
            > test-results/mereni-vse.json 2>/dev/null || true

          node scripts/shrnuti-testu.js \
            test-results/mereni-vse.json \
            "Měření: všechny E2E testy včetně těch, které CI nespouští" >> "$GITHUB_STEP_SUMMARY"

      # Jediná věc, kterou měl zrušený workflow „QA: E2E Testing Suite" a tenhle
      # job ne. Bez reportu zbývá po spadlém testu jen řádek v logu — žádná
      # trasa, žádný snímek, žádné video, přesně ve chvíli, kdy jsou potřeba.
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
          if-no-files-found: ignore

  # ── Kontrola oprávnění v manifestech ────────────────────────────────────────
  #
  # Plná aplikace míří do Google Play. SMS a seznam hovorů tam Google schválí
  # jen aplikaci, jejíž hlavní funkce je vyžaduje — to je relay, ne aplikace
  # pro operátorky. Dokud byla oprávnění ve sdíleném manifestu, dědily je obě.
  #
  # Tohle není jen ověření změny, ale POJISTKA DO BUDOUCNA: kdo přidá SMS
  # oprávnění do src/main, dozví se to tady, ne až při zamítnutí v Obchodu.
  #
  # Běží i na PR (na rozdíl od stavby APK) a trvá vteřiny — slučuje jen
  # manifesty, nestaví aplikaci.
  android-manifest-check:
    name: Android Manifest Permissions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Gradle projekt odkazuje na Capacitor pluginy, které žijí
      # v client/node_modules — bez instalace balíčků a `cap sync` ty adresáře
      # neexistují a build spadne na „Configuring project ':capacitor-app'
      # without an existing directory".
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: cd client && npm install --legacy-peer-deps --prefer-offline --no-audit

      # Bez tohohle si Gradle tahá celý strom závislostí z Maven Central a
      # z GitHub releases při KAŽDÉM běhu. 5. 11. 2026 to shodilo kontrolu
      # na PR #170: `kotlin-compiler-embeddable-2.2.10.jar` vrátil 504 Gateway
      # Time-out a celá úloha skončila chybou, přitom na repozitáři se nic
      # nezměnilo. Úloha `build-android` ten cache má od začátku; tady chyběl.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('client/android/**/*.gradle*', 'client/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Tady se adresa backendu záměrně NEnastavuje: tahle úloha staví web
      # jen proto, aby šly sloučit manifesty, a na ty API adresa nemá vliv.
      # Kontrola patří do build-android, kde se APK skutečně vyrábí.
      - name: Build web assets and sync Capacitor
        run: |
          cd client
          npm run build
          npx cap sync android

      - name: Merge manifests for both flavours
        run: |
          cd client/android
          chmod +x gradlew
          ./gradlew :app:processNexusFullDebugManifest :app:processNexusRelayDebugManifest --no-daemon -q

      - name: Full app must not declare SMS or call-log permissions
        run: |
          FULL=client/android/app/build/intermediates/merged_manifests/nexusFullDebug/processNexusFullDebugManifest/AndroidManifest.xml
          RELAY=client/android/app/build/intermediates/merged_manifests/nexusRelayDebug/processNexusRelayDebugManifest/AndroidManifest.xml
          test -f "$FULL" || { echo "::error::Sloučený manifest plné aplikace nenalezen"; exit 1; }
          test -f "$RELAY" || { echo "::error::Sloučený manifest relay nenalezen"; exit 1; }

          ZAKAZANE="READ_SMS SEND_SMS RECEIVE_SMS RECEIVE_MMS WRITE_SMS READ_CALL_LOG WRITE_CALL_LOG"
          CHYBA=0
          for P in $ZAKAZANE; do
            if grep -q "android.permission.$P" "$FULL"; then
              echo "::error::Plná aplikace deklaruje $P — Google Play to schválí jen výchozí SMS aplikaci. Patří do client/android/app/src/nexusRelay/AndroidManifest.xml."
              CHYBA=1
            fi
          done

          # Kontrola opačným směrem: relay ta oprávnění mít MUSÍ, jinak
          # přestane přijímat a odesílat SMS a nikdo si toho nevšimne.
          for P in RECEIVE_SMS SEND_SMS; do
            grep -q "android.permission.$P" "$RELAY" || {
              echo "::error::Relay NEdeklaruje $P — přestala by přijímat nebo odesílat SMS."; CHYBA=1; }
          done

          [ "$CHYBA" = 0 ] && echo "OK: plná aplikace je bez SMS oprávnění, relay je má."
          exit $CHYBA

      # Android 15+ dává typu dataSync rozpočet 6 hodin na 24 a po jeho
      # vyčerpání službu ukončí; časovač resetuje jedině otevření aplikace na
      # popředí, což se na relay telefonu v šuplíku nestane. Relay proto běží
      # na specialUse. Plná aplikace ho mít NESMÍ — Google Play k němu chce
      # samostatné zdůvodnění a ona ho nepotřebuje.
      - name: Relay runs on specialUse, full app stays on dataSync
        run: |
          FULL=client/android/app/build/intermediates/merged_manifests/nexusFullDebug/processNexusFullDebugManifest/AndroidManifest.xml
          RELAY=client/android/app/build/intermediates/merged_manifests/nexusRelayDebug/processNexusRelayDebugManifest/AndroidManifest.xml
          CHYBA=0

          grep -q 'android:foregroundServiceType="specialUse' "$RELAY" || {
            echo "::error::Relay neběží na specialUse — Android 15 mu službu po 6 hodinách ukončí a sám se už nerozjede."
            CHYBA=1; }
          grep -q 'android.permission.FOREGROUND_SERVICE_SPECIAL_USE' "$RELAY" || {
            echo "::error::Relay nedeklaruje FOREGROUND_SERVICE_SPECIAL_USE — startForeground se specialUse by spadl."
            CHYBA=1; }

          if grep -q 'android.permission.FOREGROUND_SERVICE_SPECIAL_USE' "$FULL"; then
            echo "::error::Plná aplikace deklaruje FOREGROUND_SERVICE_SPECIAL_USE — Google Play k němu chce zvláštní zdůvodnění a ona ho nepotřebuje. Patří jen do src/nexusRelay."
            CHYBA=1
          fi

          [ "$CHYBA" = 0 ] && echo "OK: relay na specialUse, plná aplikace bez něj."
          exit $CHYBA

      # Typ si sdílený kód vybírá podle toho, co má příchuť v manifestu. Když
      # se ta úvaha splete, nepřijde varování — plná aplikace spadne až na
      # telefonu na startForeground.
      - name: Foreground service type picker
        run: |
          cd client/android
          ./gradlew :app:testNexusRelayDebugUnitTest --no-daemon \
            --tests 'com.nexushub.app.NexusRelayForegroundServiceTest'

  # ── Android APK Build ───────────────────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    # Spustí se jen při push na master (ne u PR) — build trvá ~5 minut
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js (pro Capacitor sync)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('client/android/**/*.gradle*', 'client/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Verzi nastavíme jen LOKÁLNĚ pro tento build — NEcommitujeme na master.
      # master je protected (required status checks), takže přímý push z CI by byl
      # odmítnut (GH006). Monotonii versionCode navíc už zajišťuje GITHUB_RUN_NUMBER
      # v build.gradle (versionCode = major*10000 + minor + runNumber), takže
      # persistovaný bump není potřeba. versionName = 3.<minor>-b<run>.
      - name: Set Android build version (local only, no push)
        run: |
          PROPS="client/android/version.properties"
          CURRENT=$(grep "^VERSION_MINOR=" "$PROPS" | cut -d= -f2)
          NEW=$((CURRENT + 1))
          sed -i "s/^VERSION_MINOR=${CURRENT}$/VERSION_MINOR=${NEW}/" "$PROPS"
          MAJOR=$(grep "^VERSION_MAJOR=" "$PROPS" | cut -d= -f2)
          echo "Android build version: v${MAJOR}.${NEW}-b${GITHUB_RUN_NUMBER}"

      # Distribuované APK musí být podepsané STÁLÝM klíčem. Bez něj Gradle použije
      # výchozí debug keystore, který si runner generuje znovu při každém běhu —
      # každý build má pak jiný podpis a aktualizace přes existující instalaci
      # skončí na INSTALL_FAILED_UPDATE_INCOMPATIBLE. Radši build shodíme, než
      # abychom znovu vydali nenainstalovatelnou aktualizaci.
      - name: Decode Android signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_SIGNING_KEYSTORE_BASE64 chybí — build by měl nestabilní podpis a uživatelé by aktualizaci nenainstalovali."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/nexus.keystore"
          {
            echo "ANDROID_SIGNING_KEYSTORE=$RUNNER_TEMP/signing/nexus.keystore"
            echo "ANDROID_SIGNING_STORE_PASSWORD=${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}"
            echo "ANDROID_SIGNING_KEY_PASSWORD=${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}"
            echo "ANDROID_SIGNING_KEY_ALIAS=${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}"
          } >> "$GITHUB_ENV"

      - name: Install client dependencies
        run: cd client && npm install --legacy-peer-deps

      # Adresa backendu se do APK zapéká při buildu. Když VITE_API_URL chybí,
      # klient padne na hodnotu zapsanou v client/src/constants/config.js
      # a RelayContext.jsx — a tou je https://nexus-api.myvnc.com/api, tedy
      # server, který už neexistuje. APK by se postavila, nainstalovala
      # a mlčky mluvila do prázdna. Proto se to radši zastaví tady.
      #
      # Tady se /api PATŘÍ: klient ho má ve své výchozí hodnotě. Secret
      # API_BASE_URL se naopak drží bez něj, protože backend i rozvoz APK si
      # ho dopisují samy. Viz docs/novy-server-runbook.md, oddíl 8.
      #
      # Zapisuje se do GITHUB_ENV, takže ho dostanou oba APK buildy níž.
      - name: Zkontrolovat adresu backendu pro APK
        env:
          ZAKLAD: ${{ secrets.API_BASE_URL }}
        run: |
          if [ -z "$ZAKLAD" ]; then
            echo "::error::Secret API_BASE_URL není nastavený. APK by mířila na zaniklý nexus-api.myvnc.com."
            exit 1
          fi
          case "$ZAKLAD" in
            *myvnc.com*)
              echo "::error::API_BASE_URL míří na myvnc.com, což je zaniklý server."
              exit 1 ;;
            */api)
              echo "::error::API_BASE_URL nesmí končit na /api — jednotlivé úlohy si ho dopisují samy."
              exit 1 ;;
          esac
          echo "VITE_API_URL=${ZAKLAD}/api" >> "$GITHUB_ENV"
          echo "APK se postaví proti ${ZAKLAD}/api"

      - name: Build and Package Full APK
        env:
          VITE_APP_VARIANT: full
        run: |
          cd client
          export VITE_APP_VERSION="v$(node -p "require('./package.json').version")-b${{ github.run_number }}"
          npm run build
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleNexusFullDebug --no-daemon

      - name: Build and Package Relay APK
        env:
          VITE_APP_VARIANT: relay
        run: |
          cd client
          export VITE_APP_VERSION="v$(node -p "require('./package.json').version")-b${{ github.run_number }}"
          npm run build
          cp dist/index.relay.html dist/index.html
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleNexusRelayDebug --no-daemon

      - name: Rename APKs
        run: |
          FULL_APK_PATH=$(find client/android/app/build/outputs/apk/nexusFull/debug -name "*.apk" | head -1)
          RELAY_APK_PATH=$(find client/android/app/build/outputs/apk/nexusRelay/debug -name "*.apk" | head -1)
          
          cp "$FULL_APK_PATH" nexus-full-latest.apk
          cp "$RELAY_APK_PATH" nexus-relay-latest.apk

      # Pojistka: ověř, že APK opravdu podepsal očekávaný klíč. Kdyby konfigurace
      # podepisování někdy tiše vypadla, Gradle by sáhl po výchozím debug keystoru
      # a my bychom zase vydali build, který nejde nainstalovat jako aktualizace.
      - name: Verify APKs are signed with the stable key
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          EXPECTED=$(keytool -list -v -keystore "$ANDROID_SIGNING_KEYSTORE" \
            -storepass "$ANDROID_SIGNING_STORE_PASSWORD" 2>/dev/null \
            | grep -i "SHA256:" | head -1 | sed 's/.*SHA256: //' | tr -d ' :' | tr 'A-Z' 'a-z')
          for apk in nexus-full-latest.apk nexus-relay-latest.apk; do
            ACTUAL=$("$APKSIGNER" verify --print-certs "$apk" | grep -i "SHA-256 digest" | head -1 | sed 's/.*: //' | tr -d ' ' | tr 'A-Z' 'a-z')
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::$apk je podepsané jiným klíčem ($ACTUAL != $EXPECTED) — aktualizace by nešly nainstalovat."
              exit 1
            fi
            echo "OK: $apk podepsáno očekávaným klíčem"
          done

      - name: Upload APKs jako artifacts (pro ruční stažení)
        uses: actions/upload-artifact@v4
        with:
          name: nexus-apks
          path: |
            nexus-full-latest.apk
            nexus-relay-latest.apk
          retention-days: 30

  # ── Deploy APK na VPS ───────────────────────────────────────────────────────
  deploy-apk:
    name: Deploy APK to VPS
    runs-on: ubuntu-latest
    needs: [build-android, deploy-backend]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: nexus-apks

      - name: Upload Relay APK na VPS přes API
        run: |
          echo "Waiting 15s for backend to fully stabilize after PM2 restart..."
          sleep 15
          curl --retry 5 --retry-delay 5 -f -X POST \
            "${{ secrets.API_BASE_URL }}/api/vultr/upload-apk" \
            -H "Authorization: Bearer ${{ secrets.APK_DEPLOY_TOKEN }}" \
            -F "apk=@nexus-relay-latest.apk" \
            --max-time 120 \
            -o response_relay.json \
            -w "\nHTTP Status: %{http_code}\n"
          cat response_relay.json

      - name: Upload Full APK na VPS přes API
        run: |
          # Pokud endpoint ukládá soubor jen jako jedno hardcodované jméno, přemaže to, ale i tak pošleme
          curl --retry 5 --retry-delay 5 -f -X POST \
            "${{ secrets.API_BASE_URL }}/api/vultr/upload-apk" \
            -H "Authorization: Bearer ${{ secrets.APK_DEPLOY_TOKEN }}" \
            -F "apk=@nexus-full-latest.apk" \
            --max-time 120 \
            -o response_full.json \
            -w "\nHTTP Status: %{http_code}\n"
          cat response_full.json

  # ── Úloha `sync-backend` byla odstraněna 5. 11. 2026 ─────────────────────
  #
  # Vynuceně tlačila složku `server/` jako subtree do zrcadla
  # `NexusSync-Systems/nexus-backend`. Mělo to smysl, dokud si server kód
  # odtamtud stahoval `git pull`em. Od #155 ho doručuje rsync přímo z téhle
  # pipeline a na serveru `.git` vůbec není — ověřeno.
  #
  # Zbyla po tom past. Zrcadlo má VLASTNÍ `deploy.yml`, který na push do
  # masteru dělá na serveru `git reset --hard origin/master` a `git pull`.
  # Každý push z téhle úlohy ho spustil a on pokaždé selhal, protože
  # `SERVER_IP` a `SSH_PRIVATE_KEY` v tom repozitáři jsou z března 2026, tedy
  # od smazaného VPS. Jen 5. 11. 2026 tak vznikla tři selhání za sebou.
  #
  # Nebezpečné by to bylo ve chvíli, kdy by ty secrety někdo přepsal na nový
  # server: začal by dělat `git reset --hard` na stroji bez `.git` a přehazoval
  # by si s `deploy-backend` `.env` a restarty pm2.
  #
  # `deploy-backend` navíc na téhle úloze viselo přes `needs`, takže skutečné
  # nasazení záviselo na kroku, jehož jediný efekt bylo spustit to selhávající.
  #
  # Samotný repozitář `nexus-backend` zůstává; bez nových pushů se jeho
  # nasazení prostě nespustí. Jestli ho archivovat, je rozhodnutí na člověku.
  # Secret `SYNC_BACKEND_TOKEN` v tomhle repozitáři už nic nepoužívá.

  deploy-backend:
    name: Deploy Backend (SSH)
    runs-on: ubuntu-latest
    # Dřív `needs: [sync-backend]`. Teď přímo na testech — nasazení má čekat
    # na to, že kód projde, ne na synchronizaci zrcadla.
    needs: [test, e2e-tests]
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4

      # Kód na server DORUČUJE CI. Server si ho dřív stahoval sám přes
      # `git pull origin master`, jenže `/root/nexus-backend` má origin na
      # privátní https adresu bez přihlašovacích údajů — fetch končil na
      # „could not read Username" a nasazení spadlo na prvním kroku.
      #
      # Druhá cesta by byla dát serveru deploy key. Tahle je lepší: na stroji
      # dostupném z internetu pak neleží ŽÁDNÝ přístup ke GitHubu, není co
      # rotovat ani co unikne, kdyby se na server někdo dostal.
      #
      # `--delete` je tu schválně: bez něj by smazané soubory na serveru
      # zůstaly ležet navždy a nasazená verze by se tiše rozcházela s repem.
      # Co se smazat NESMÍ, je ve výjimkách — `.env` se na server nikdy
      # nekopíruje, `node_modules` (348 MB) ani `public/downloads` (109 MB)
      # se nepřenášejí.
      #
      # `.git` je vyloučený a smaže se jednou v těle skriptu: nechat ho tam
      # zastaralý by znamenalo, že `git log` na serveru lže o tom, co běží.
      - name: Doručit kód na server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail

          # Pojistka pred destruktivni operaci. `--delete` smaze na serveru vse,
          # co neni ve zdroji — kdyby `server/` byl prazdny nebo neuplny (spatny
          # checkout, prejmenovany adresar), setrel by bezici aplikaci. Zmereno:
          # proti prazdnemu adresari by slo o 256 souboru.
          #
          # Levnejsi je overit, ze zdroj vypada jako backend, nez to pak
          # obnovovat ze zalohy.
          for SOUBOR in server/package.json server/src/index.js server/prisma/schema.prisma; do
            if [ ! -f "$SOUBOR" ]; then
              echo "::error::$SOUBOR chybi — nenasazuji. Rsync s --delete by server setrel."
              exit 1
            fi
          done
          POCET=$(find server -type f -not -path 'server/node_modules/*' | wc -l)
          if [ "$POCET" -lt 100 ]; then
            echo "::error::V server/ je jen $POCET souboru, cekano aspon 100 — nenasazuji."
            exit 1
          fi
          echo "Zdroj vypada v poradku: $POCET souboru."

          KLIC="$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$KLIC"
          chmod 600 "$KLIC"

          rsync -az --delete \
            --rsync-path="sudo rsync" \
            -e "ssh -i $KLIC -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20" \
            --exclude '.git/' \
            --exclude '.env' --exclude '.env.*' \
            --exclude 'node_modules/' \
            --exclude 'public/downloads/' \
            --exclude 'downloads/' \
            --exclude 'logs/' \
            --exclude 'uploads/' \
            --exclude '.DS_Store' --exclude '._*' \
            server/ "$DEPLOY_USER@$DEPLOY_HOST:/root/nexus-backend/"

          rm -f "$KLIC"
          echo "Kod dorucen na $DEPLOY_HOST:/root/nexus-backend"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          # Do NASAZENO.txt na serveru. Musi projit az dovnitr sudo — viz nize.
          NASAZENY_COMMIT: ${{ github.sha }}
          NASAZENY_BEH: ${{ github.run_number }}
        with:
          envs: NASAZENY_COMMIT,NASAZENY_BEH
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          # Přihlášení KLÍČEM, ne heslem. Obraz Ubuntu u Oracle Cloudu má
          # `PasswordAuthentication no` a rootovi do authorized_keys vkládá
          # vynucený příkaz, který přihlášení odmítne — heslem se tam tedy
          # připojit nelze a nastavovat ho na stroji s portem 22 otevřeným do
          # internetu by byl krok zpátky.
          #
          # DEPLOY_USER proto musí být běžný uživatel se sudo (na Oracle
          # Ubuntu `ubuntu`), DEPLOY_SSH_KEY jeho privátní klíč.
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # Celé tělo běží pod rootem: aplikace leží v /root/nexus-backend
            # a pm2 proces vlastní root. Uvozený heredoc znamená, že proměnné
            # rozbaluje až ten vnitřní shell, ne přihlašovací.
            #
            # `exit 1` uvnitř ukončí vnitřní shell, sudo vrátí jeho návratový
            # kód a krok spadne — pojistky níž tedy fungují dál.
            # Promenne se predavaji jako argumenty sudo. Heredoc je uvozeny,
            # takze je vnitrni shell dostane jen takhle — jinak by v NASAZENO.txt
            # byly prazdne radky a nikdo by si toho nevsiml.
            sudo NASAZENY_COMMIT="$NASAZENY_COMMIT" NASAZENY_BEH="$NASAZENY_BEH" bash -s <<'NEXUS_DEPLOY'
            cd /root/nexus-backend

            # Kod sem dorucil predchozi krok rsyncem. Zadne stahovani z GitHubu
            # se tu nedeje a server k nemu nema mit pristup.
            #
            # Zastaraly .git by tvrdil, ze bezi neco jineho, nez co rsync
            # prinesl. Pryc s nim; zaznamem o nasazeni je NASAZENO.txt
            # a historie zustava na GitHubu.
            if [ -d .git ]; then
              rm -rf .git
              echo "Odstranen zastaraly .git — kod dorucuje CI, ne git pull."
            fi

            # Zbytky po rucnim nasazeni z macOS (3. 11. 2026): doprovodne soubory
            # `._*`. Rsync je ma mezi vyjimkami, aby se nikdy neprenasely, jenze
            # vyjimka zaroven brani jejich smazani — zustaly by tu navzdy.
            find . -name '._*' -type f -delete 2>/dev/null || true
            if [ -n "${{ secrets.STRIPE_SECRET_KEY }}" ] && [ -z "${{ secrets.STRIPE_WEBHOOK_SECRET }}" ]; then
              echo "STRIPE_SECRET_KEY is configured, but STRIPE_WEBHOOK_SECRET is missing. Refusing to deploy billing without webhook verification."
              exit 1
            fi
            if [ -n "${{ secrets.STRIPE_SECRET_KEY }}" ] && [ -z "${{ secrets.STRIPE_PUBLISHABLE_KEY }}" ]; then
              echo "STRIPE_SECRET_KEY is configured, but STRIPE_PUBLISHABLE_KEY is missing. Refusing to deploy incomplete billing config."
              exit 1
            fi
            if [ -n "${{ secrets.STRIPE_SECRET_KEY }}" ]; then
              touch .env
              grep -vE '^(STRIPE_PUBLISHABLE_KEY|STRIPE_SECRET_KEY|STRIPE_WEBHOOK_SECRET|REQUIRE_STRIPE_CONFIG)=' .env > .env.tmp || true
              mv .env.tmp .env
              echo "STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}" >> .env
              echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}" >> .env
              echo "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}" >> .env
              echo "REQUIRE_STRIPE_CONFIG=true" >> .env
            fi
            # Token pro nahrávání APK z CI — server ho musí znát, aby upload prošel.
            # Doplníme ho sem ze secretu, ať se nemusí ručně editovat .env na serveru
            # (a ať se nemůže rozejít s hodnotou, kterou posílá CI).
            if [ -n "${{ secrets.APK_DEPLOY_TOKEN }}" ]; then
              touch .env
              grep -vE '^APK_DEPLOY_TOKEN=' .env > .env.tmp || true
              mv .env.tmp .env
              echo "APK_DEPLOY_TOKEN=${{ secrets.APK_DEPLOY_TOKEN }}" >> .env
            fi
            STRICT_RUNTIME_SECRETS=true node scripts/audit-runtime-secrets.js
            npm install
            ./node_modules/.bin/prisma generate

            # ── Brána: čekající migrace jen přes ověřenou zálohu ───────────────
            #
            # Tady dřív stálo, že `migrate deploy` je bezpečný, protože „nic
            # negeneruje/neshazuje". To už neplatí. Aplikuje migrace tak, jak
            # jsou napsané, a 20261027000001_blacklist_reasons ZAHAZUJE sloupce
            # s volným textem. Po jejím proběhnutí není z čeho je vzít zpět
            # a v celém řetězci sync-backend → deploy-backend nebyla záloha.
            #
            # Zálohuje se JEN když něco čeká. Když ne, denní záloha z cronu
            # stačí a dump navíc by prodloužil každý deploy o minuty.
            #
            # Stav se pozná z VÝPISU, ne z návratového kódu: `migrate status`
            # vrací nenulu i při nedostupné databázi, takže samotný kód
            # nerozliší „něco čeká" od „nevím". Obě hlášky jsou ověřené proti
            # prisma 6.1.0 (node_modules/prisma/build/index.js).
            #
            # CO BRÁNA NEPOZNÁ: `migrate status` čte tabulku _prisma_migrations
            # a porovnává ji se složkou prisma/migrations. Skutečnou strukturu
            # databáze NEKONTROLUJE — ruční `ALTER TABLE` na produkci historii
            # nezmění, takže status dál hlásí „up to date" a záloha se nevezme.
            # Na schema drift tedy tahle brána není a nikdy nebude; od toho je
            # samostatná úloha Schema Drift Check a `prisma migrate diff`.
            # Brána hlídá jen to, co umí: aby MIGRACE neproběhla bez zálohy.
            stav="$(./node_modules/.bin/prisma migrate status 2>&1 || true)"
            printf '%s\n' "$stav"

            if printf '%s' "$stav" | grep -q 'Database schema is up to date'; then
              echo "→ Nic nečeká, zálohu nepotřebuji."
            elif printf '%s' "$stav" | grep -q 'Following migration.* have not yet been applied'; then
              echo "→ Čekající migrace. Nejdřív ověřená záloha, pak teprve migrace."

              # Bez pg_dump/pg_restore nejde záloha ani pořídit, ani ověřit.
              # Radši sem spadne deploy s jasnou hláškou, než aby migrace
              # proběhla nezajištěná.
              for n in pg_dump pg_restore; do
                if ! command -v "$n" >/dev/null 2>&1; then
                  echo "❌ Chybí $n — zálohu nelze pořídit. Migraci nepouštím."
                  echo "   Na serveru: apt-get install -y postgresql-client"
                  exit 1
                fi
              done

              # backup-postgres.sh si sám ověří velikost, čitelnost
              # (pg_restore --list) i checksum; při jakékoli chybě vadný soubor
              # smaže a skončí nenulově. Vlastní adresář a delší retence proto,
              # že tahle záloha je poslední stav PŘED nevratnou změnou — ta se
              # nemá protáčet po čtrnácti dnech spolu s běžnými dumpy.
              #
              # Explicitní `if !` je potřeba: ssh-action nemá script_stop, takže
              # samotné selhání příkazu běh nezastaví (proto jsou výš u Stripe
              # kontrol taky ruční `exit 1`).
              if ! BACKUP_DIR=/var/backups/nexus-pred-migraci \
                   RETENTION_DAYS=90 \
                   bash scripts/backup-postgres.sh; then
                echo "❌ Záloha neprošla. Migraci NEPOUŠTÍM, databáze zůstává, jak je."
                exit 1
              fi
              echo "→ Záloha ověřena, pokračuji migrací."
            else
              # Sem spadne rozejitá historie migrací, databáze, kterou Prisma
              # nespravuje, i nedostupná databáze. V žádném z těch stavů nemá
              # `migrate deploy` co dělat naslepo.
              #
              # Pozor: rozejitá historie taky obsahuje „have not yet been
              # applied", proto se výš hledá celá hláška „Following migration…
              # have not yet been applied", ne jen její konec.
              echo "❌ Stav migrací se nepodařilo určit (výpis výše)."
              echo "   Rozejitá historie, neřízená databáze, nebo nedostupná databáze."
              echo "   Deploy zastavuji — tohle chce člověka."
              exit 1
            fi

            ./node_modules/.bin/prisma migrate deploy
            # Vstupní bod je src/index.js (viz "main" a "start" v package.json).
            # Dřív tu stálo server.js, který v backendovém repozitáři vůbec
            # není — záložní větev tedy nikdy nemohla projít. Nevadilo to,
            # dokud proces na serveru existoval a stačil restart; na čistém
            # serveru by se ale backend nerozjel a deploy by spadl právě tady.
            # Zaznam o tom, co tu bezi. Nahrazuje `git log`, ktery po odstraneni
            # .git neni — bez nej by na serveru nebylo jak zjistit nasazenou verzi.
            {
              echo "commit:   ${NASAZENY_COMMIT}"
              echo "beh:      ${NASAZENY_BEH}"
              echo "nasazeno: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            } > /root/nexus-backend/NASAZENO.txt

            pm2 restart nexus-backend-final --update-env || pm2 start src/index.js --name nexus-backend-final
            sleep 3
            pm2 status nexus-backend-final | grep -q online && echo "Deploy OK" || exit 1
            # ── Údržba instance proti zabavení Oraclem ─────────────────────────
            #
            # Always Free instanci smí Oracle zabavit, když je 7 dní nečinná
            # (95. percentil CPU pod 20 %). Měřeno 5. 11. 2026 ze sysstatu:
            # 2,22 %, tedy devětkrát pod mezí.
            #
            # Instaluje se odsud, protože jinak než nasazením se na server
            # zapsat nedá — a zároveň se tím opatření samo obnoví, kdyby se
            # stroj přestavoval.
            #
            # Nefatální schválně: běžící aplikace je důležitější než zátěž.
            # Že se to opravdu nainstalovalo, hlídá workflow Hlídka serveru —
            # selže, když /etc/cron.d/nexus-udrzba chybí.
            bash scripts/server-cron/instaluj-udrzbu.sh \
              || echo "::warning::Instalace údržby instance neprošla — instance zůstává kandidátem na zabavení."

            # ── Konfigurace: práva a záloha ────────────────────────────────────
            #
            # .env mělo 5. 11. 2026 práva 644, tedy čitelné pro kohokoli na
            # stroji — včetně STRIPE_SECRET_KEY a JWT_SECRET. Srovnává se to
            # tady, protože kroky výš do .env zapisují a vytvoří ho s umaskem
            # přihlašovacího shellu.
            chmod 600 .env 2>/dev/null || true

            # Záloha konfigurace hned po nasazení, protože .env se mění právě
            # tady (Stripe klíče a APK token se dopisují ze secretů).
            #
            # Noční záloha zálohuje POUZE databázi. ENCRYPTION_KEY, kterým
            # profileController.js šifruje profile.credentials, nikde jinde
            # neexistuje — bez něj by se obnovená databáze nedala přečíst.
            # Záloha, kterou nejde rozšifrovat, není záloha.
            bash scripts/server-cron/zaloha-konfigurace.sh \
              || echo "::warning::Záloha konfigurace neprošla — ENCRYPTION_KEY a spol. existují dál jen na tomhle stroji."

            # Stahování APK obsluhuje Express z public/downloads (viz app.js),
            # ne nginx, a běží jako root — na právech mu tedy nezáleží. Tyhle
            # chmody jsou pojistka pro případ, že by soubory někdy servíroval
            # nginx jako www-data.
            #
            # Dřív tu byly cesty /root/nexus-backend/server/..., které na
            # serveru VŮBEC NEEXISTUJÍ — kód leží přímo v /root/nexus-backend.
            # Kvůli `|| true` to tiše nedělalo nic a práva na skutečné cestě
            # nastavil 3. 11. 2026 někdo ručně. Po přestavbě stroje by se
            # nenastavila a stahování APK by přestalo fungovat.
            chmod o+x /root || true
            chmod o+x /root/nexus-backend || true
            chmod o+x /root/nexus-backend/public || true
            chmod -R o+rx /root/nexus-backend/public/downloads || true
            NEXUS_DEPLOY

  deploy-frontend:
    name: Deploy Frontend (Firebase)
    runs-on: ubuntu-latest
    needs: [build-client] # Removed e2e-tests dependency temporarily
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      # Totéž co u APK: bez VITE_API_URL by se web postavil proti hodnotě
      # zapsané v client/src/constants/config.js, tedy proti zaniklému
      # nexus-api.myvnc.com. Nasazený web by se tvářil funkčně a každý
      # požadavek by skončil chybou sítě.
      - name: Install & Build
        env:
          ZAKLAD: ${{ secrets.API_BASE_URL }}
        run: |
          if [ -z "$ZAKLAD" ]; then
            echo "::error::Secret API_BASE_URL není nastavený. Web by mířil na zaniklý nexus-api.myvnc.com."
            exit 1
          fi
          case "$ZAKLAD" in
            *myvnc.com*)
              echo "::error::API_BASE_URL míří na myvnc.com, což je zaniklý server."
              exit 1 ;;
            */api)
              echo "::error::API_BASE_URL nesmí končit na /api — dopisuje se tady."
              exit 1 ;;
          esac
          export VITE_API_URL="${ZAKLAD}/api"
          echo "Web se postaví proti ${VITE_API_URL}"
          cd client
          npm install --legacy-peer-deps
          export VITE_APP_VERSION="v$(node -p "require('./package.json').version")-b${{ github.run_number }}"
          npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEXUS_SYNC_8D50B }}'
          channelId: live
          projectId: nexus-sync-8d50b

  # ── Backup / restore readiness audit ──────────────────────────────────────────
  backup-restore-audit:
    name: Backup / Restore Readiness Audit
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Install PostgreSQL client tools
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client

      # CI runner nemá přístup k produkčním zálohám ani k restore DB (a prod DB
      # creds do efemérního CI nepatří). Tady běží jen ADVISORY kontrola statické
      # konfigurace (dostupnost pg nástrojů, zapisovatelný dir, formát retention).
      # STRICT readiness (existence + integrita reálné zálohy) se ověřuje na VPS
      # přímo v server/scripts/backup-postgres.sh při každém běhu zálohy.
      - name: Backup/restore config sanity (advisory)
        run: node server/scripts/audit-backup-restore.js
        env:
          BACKUP_DIR:     '/tmp/nexus-backups'
          RETENTION_DAYS: ${{ secrets.BACKUP_RETENTION_DAYS || '30' }}

  # ── Údržba instance proti zabavení (Oracle Always Free) ──────────────────────
  #
  # Tyhle skripty běží na produkčním serveru jako root z cronu. Zápis na server
  # přes SSH je mimo to, co smím dělat, takže je tam instaluje nasazení — a tím
  # spíš musí být ověřené TADY, dřív než se tam dostanou.
  #
  # Netestuje se „skript skončil nulou". Testuje se, že OPRAVDU VZNIKLA ZÁTĚŽ
  # (měří se jiffies v /proc/stat), že vypínač funguje, že se běhy nevrství
  # a že instalátor cronu je idempotentní.
  udrzba-instance-test:
    name: Test údržby instance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: |
          shellcheck --version
          shellcheck server/scripts/server-cron/udrzuj-instanci.sh \
                     server/scripts/server-cron/instaluj-udrzbu.sh \
                     server/scripts/server-cron/zaloha-konfigurace.sh \
                     scripts/odvez-zalohu.sh

      - name: Bit x je ve gitu
        run: |
          set -euo pipefail
          for S in udrzuj-instanci.sh instaluj-udrzbu.sh zaloha-konfigurace.sh; do
            REZIM=$(git ls-files --stage "server/scripts/server-cron/$S" | awk '{print $1}')
            # Bez spustitelného bitu v gitu by rsync na server dovezl soubor,
            # který cron nespustí — a selhávalo by to tiše každou půlhodinu.
            if [ "$REZIM" != "100755" ]; then
              echo "::error::$S má v gitu režim $REZIM, čekáno 100755 (spustitelný)."
              exit 1
            fi
            echo "✓ $S je 100755"
          done

      - name: Zátěž opravdu vznikne
        run: |
          set -euo pipefail

          # „nice" čas v /proc/stat je tady ten správný ukazatel: zátěž běží
          # s nice 19, takže se započítá právě sem a na jinak nevytíženém
          # runneru je to čistý signál. Jiffies jsou stovkiny sekundy.
          PRED=$(awk '/^cpu /{print $3}' /proc/stat)

          sudo NEXUS_UDRZBA_SEKUND=6 bash server/scripts/server-cron/udrzuj-instanci.sh

          PO=$(awk '/^cpu /{print $3}' /proc/stat)
          ROZDIL=$(( PO - PRED ))
          echo "nice jiffies: $PRED → $PO (rozdíl $ROZDIL, tedy ~$(( ROZDIL / 100 )) s CPU)"

          # Šest sekund na jednom vlákně je ~600 jiffies. Mez 200 je volná
          # schválně — runner může být vytížený jinými věcmi.
          if [ "$ROZDIL" -lt 200 ]; then
            echo "::error::Zátěž nevznikla (rozdíl jen $ROZDIL jiffies). Skript neběžel nebo neběžel na CPU."
            exit 1
          fi

          # A že o sobě nechal stopu, kterou čte hlídka.
          sudo grep -q 'OK:' /var/log/nexus-udrzba.log || {
            echo "::error::V logu chybí řádek OK: — hlídka by to hlásila jako selhání údržby."
            sudo cat /var/log/nexus-udrzba.log || true
            exit 1
          }
          sudo test -s /var/log/nexus-udrzba-posledni.txt || {
            echo "::error::Nevznikl soubor s posledním během."
            exit 1
          }
          echo "✓ zátěž vznikla, log i stopa jsou na místě"

      - name: Vypínač zastaví zátěž
        run: |
          set -euo pipefail

          # Kdyby zátěž na produkci někdy překážela, musí jít zastavit bez
          # nasazení a bez editace cronu. Když tohle nefunguje, nemá se to
          # na server vůbec dostat.
          sudo touch /etc/nexus-udrzba-vypnuto
          PRED=$(awk '/^cpu /{print $3}' /proc/stat)
          sudo NEXUS_UDRZBA_SEKUND=6 bash server/scripts/server-cron/udrzuj-instanci.sh
          PO=$(awk '/^cpu /{print $3}' /proc/stat)
          ROZDIL=$(( PO - PRED ))
          echo "nice jiffies při vypnutém stavu: rozdíl $ROZDIL"

          if [ "$ROZDIL" -gt 100 ]; then
            echo "::error::Vypínač nezabral — zátěž vznikla i s /etc/nexus-udrzba-vypnuto."
            exit 1
          fi
          sudo grep -q 'VYPNUTO' /var/log/nexus-udrzba.log || {
            echo "::error::Vypnutý běh se nezapsal do logu."
            exit 1
          }
          sudo rm -f /etc/nexus-udrzba-vypnuto
          echo "✓ vypínač funguje"

      - name: Běhy se nevrství
        run: |
          set -euo pipefail

          # Na zpomaleném stroji by se běhy mohly překrývat a zátěž by rostla
          # místo toho, aby zůstala na nastavené úrovni. Druhý běh musí odejít.
          sudo NEXUS_UDRZBA_SEKUND=10 bash server/scripts/server-cron/udrzuj-instanci.sh &
          PRVNI=$!
          sleep 2
          sudo NEXUS_UDRZBA_SEKUND=10 bash server/scripts/server-cron/udrzuj-instanci.sh
          wait $PRVNI

          sudo grep -q 'PŘESKAKUJI' /var/log/nexus-udrzba.log || {
            echo "::error::Druhý souběžný běh se nezastavil — zámek nefunguje."
            sudo tail -5 /var/log/nexus-udrzba.log || true
            exit 1
          }
          echo "✓ zámek drží, druhý běh odešel"

      - name: Instalátor cronu je idempotentní
        run: |
          set -euo pipefail

          PRVNI=$(sudo bash server/scripts/server-cron/instaluj-udrzbu.sh)
          echo "$PRVNI"
          echo "$PRVNI" | grep -q 'Nastaven cron' || {
            echo "::error::První instalace cron nenastavila."
            exit 1
          }

          # Soubor v /etc/cron.d musí mít uživatele v šestém poli, jinak ho
          # cron tiše ignoruje a nikdo si toho nevšimne.
          echo "--- /etc/cron.d/nexus-udrzba ---"
          sudo cat /etc/cron.d/nexus-udrzba
          RADEK=$(sudo grep -E '^[0-9,*/-]+ ' /etc/cron.d/nexus-udrzba | head -1)
          POLI=$(echo "$RADEK" | awk '{print NF}')
          if [ "$POLI" -lt 7 ]; then
            echo "::error::Řádek cronu má jen $POLI polí — chybí uživatel nebo cesta."
            exit 1
          fi
          echo "$RADEK" | awk '{print $6}' | grep -qx root || {
            echo "::error::V šestém poli není root."
            exit 1
          }
          CESTA=$(echo "$RADEK" | awk '{print $7}')
          sudo test -x "$CESTA" || {
            echo "::error::Cron ukazuje na $CESTA, což není spustitelný soubor."
            exit 1
          }

          REZIM=$(stat -c %a /etc/cron.d/nexus-udrzba)
          [ "$REZIM" = "644" ] || {
            echo "::error::/etc/cron.d/nexus-udrzba má režim $REZIM, cron vyžaduje 644."
            exit 1
          }

          # Druhé nasazení nesmí soubor přepsat — jinak by se při každém
          # nasazení měnil mtime a nešlo by poznat, kdy se to vlastně změnilo.
          DRUHY=$(sudo bash server/scripts/server-cron/instaluj-udrzbu.sh)
          echo "$DRUHY"
          echo "$DRUHY" | grep -q 'už nastavený' || {
            echo "::error::Druhé spuštění není idempotentní."
            exit 1
          }
          echo "✓ instalátor je idempotentní, cron je platný"

      - name: Instalátor odmítne chybějící skript
        run: |
          set -euo pipefail

          # Cron ukazující na neexistující soubor by selhával každou půlhodinu
          # a hlídka by hlásila nefunkční ochranu. Instalátor to musí zachytit.
          mkdir -p /tmp/prazdno
          cp server/scripts/server-cron/instaluj-udrzbu.sh /tmp/prazdno/
          if sudo bash /tmp/prazdno/instaluj-udrzbu.sh; then
            echo "::error::Instalátor prošel i bez udrzuj-instanci.sh vedle sebe."
            exit 1
          fi
          echo "✓ instalátor bez skriptu odmítl pokračovat"

      # ── Záloha konfigurace ──────────────────────────────────────────────────
      # Tohle je jediná kopie ENCRYPTION_KEY mimo server. Když selže tiše,
      # zjistí se to až ve chvíli, kdy je obnovená databáze nečitelná.
      - name: Konfigurace se zašifruje, ověří a neunikne do logu
        run: |
          set -euo pipefail
          # Kontext do logu: chování gpg se mezi verzemi liší a bez tohohle
          # se u selhání nepozná, jestli jde o skript, nebo o prostředí.
          gpg --version | head -2

          PRAC=$(mktemp -d)
          printf 'dostatecne-dlouhe-testovaci-heslo-nad-dvacet-znaku\n' > "$PRAC/heslo"
          chmod 600 "$PRAC/heslo"
          printf 'ENCRYPTION_KEY=NEMA_SE_OBJEVIT_V_LOGU_XYZZY\nJWT_SECRET=druhe-tajemstvi\n' > "$PRAC/env"

          # Výstup se zachytává kvůli kontrole, že v něm nejsou tajemství —
          # jenže při selhání by se pod `set -e` ztratil a v logu by zbyl jen
          # návratový kód. Proto se při neúspěchu vypíše.
          if ! VYSTUP=$(NEXUS_ZALOHA_HESLO="$PRAC/heslo" NEXUS_ENV_SOUBOR="$PRAC/env" \
                        NEXUS_BACKUP_DIR="$PRAC/zalohy" \
                        bash server/scripts/server-cron/zaloha-konfigurace.sh); then
            echo "::error::Skript zálohy konfigurace selhal. Co stihl vypsat na stdout:"
            echo "$VYSTUP"
            exit 1
          fi
          echo "$VYSTUP"

          # 1) Tajemství nesmí být nikde ve výstupu. Skript běží z cronu do
          #    logu a jeho výstup se objevuje i v logu nasazení, který je
          #    u veřejného repozitáře čitelný pro kohokoli.
          if echo "$VYSTUP" | grep -q 'XYZZY'; then
            echo "::error::Obsah .env se dostal do výstupu skriptu."
            exit 1
          fi
          echo "✓ tajemství ve výstupu není"

          ARCHIV=$(ls "$PRAC/zalohy"/konfigurace_*.env.gpg)
          echo "✓ vznikl $(basename "$ARCHIV")"

          # 2) Nešifrovaná kopie .env nesmí v adresáři záloh zůstat ležet.
          if ls "$PRAC/zalohy" | grep -vE '\.gpg$|\.sha256-obsahu$' | grep -q .; then
            echo "::error::V adresáři záloh je i něco jiného než .gpg a součet:"
            ls -la "$PRAC/zalohy"
            exit 1
          fi
          echo "✓ nešifrovaná kopie nikde neleží"

          # 3) Archiv musí jít otevřít a dát původní obsah. Zašifrovaný soubor,
          #    který nikdo nezkusil rozšifrovat, je jen naděje.
          gpg --batch --quiet --pinentry-mode loopback --passphrase-file "$PRAC/heslo" \
              --decrypt "$ARCHIV" > "$PRAC/zpet" 2>/dev/null
          if ! cmp -s "$PRAC/env" "$PRAC/zpet"; then
            echo "::error::Rozšifrovaný archiv nesouhlasí s původním .env."
            exit 1
          fi
          echo "✓ rozšifrovaný archiv je totožný s originálem"

          # 4) Sidecar musí nést součet originálu — odvoz podle něj ověřuje.
          OCEKAVANY=$(sha256sum "$PRAC/env" | cut -d' ' -f1)
          ULOZENY=$(cut -d' ' -f1 < "$ARCHIV.sha256-obsahu")
          [ "$OCEKAVANY" = "$ULOZENY" ] || {
            echo "::error::Součet v sidecaru neodpovídá .env."
            exit 1
          }
          echo "✓ kontrolní součet sedí"

      - name: Nezměněná konfigurace nedělá další kopii
        run: |
          set -euo pipefail
          PRAC=$(mktemp -d)
          printf 'dostatecne-dlouhe-testovaci-heslo-nad-dvacet-znaku\n' > "$PRAC/heslo"
          printf 'ENCRYPTION_KEY=abc\n' > "$PRAC/env"
          SPUST() {
            NEXUS_ZALOHA_HESLO="$PRAC/heslo" NEXUS_ENV_SOUBOR="$PRAC/env" \
            NEXUS_BACKUP_DIR="$PRAC/zalohy" \
            bash server/scripts/server-cron/zaloha-konfigurace.sh
          }

          SPUST > /dev/null
          DRUHY=$(SPUST)
          echo "$DRUHY"
          echo "$DRUHY" | grep -q 'nezměnila' || {
            echo "::error::Druhý běh nad nezměněnou konfigurací udělal další kopii."
            exit 1
          }
          [ "$(ls "$PRAC/zalohy"/konfigurace_*.env.gpg | wc -l)" = "1" ] || {
            echo "::error::V adresáři je víc archivů, než má být."
            exit 1
          }

          # Po změně naopak kopie vzniknout MUSÍ, jinak by se nová hodnota
          # ENCRYPTION_KEY nikdy nezazálohovala.
          sleep 1
          printf 'ENCRYPTION_KEY=zmeneno\n' > "$PRAC/env"
          SPUST > /dev/null
          [ "$(ls "$PRAC/zalohy"/konfigurace_*.env.gpg | wc -l)" = "2" ] || {
            echo "::error::Po změně .env nevznikla nová kopie."
            ls -la "$PRAC/zalohy"
            exit 1
          }
          echo "✓ kopie vzniká jen při změně, ale při změně vždy"

      - name: Retence nesmaže jedinou kopii klíče
        run: |
          set -euo pipefail

          # Past, kterou tohle hlídá: konfigurace se mění zřídka, takže
          # `find -mtime +14 -delete` by po dvou týdnech beze změny smazalo
          # JEDINOU existující kopii ENCRYPTION_KEY — a odvezené databáze by
          # tím zůstaly navždy nečitelné.
          PRAC=$(mktemp -d)
          printf 'dostatecne-dlouhe-testovaci-heslo-nad-dvacet-znaku\n' > "$PRAC/heslo"
          printf 'ENCRYPTION_KEY=abc\n' > "$PRAC/env"
          NEXUS_ZALOHA_HESLO="$PRAC/heslo" NEXUS_ENV_SOUBOR="$PRAC/env" \
            NEXUS_BACKUP_DIR="$PRAC/zalohy" \
            bash server/scripts/server-cron/zaloha-konfigurace.sh > /dev/null

          ARCHIV=$(ls "$PRAC/zalohy"/konfigurace_*.env.gpg)
          touch -d '60 days ago' "$ARCHIV" "$ARCHIV.sha256-obsahu"

          NEXUS_ZALOHA_HESLO="$PRAC/heslo" NEXUS_ENV_SOUBOR="$PRAC/env" \
            NEXUS_BACKUP_DIR="$PRAC/zalohy" NEXUS_KONFIG_RETENCE=14 \
            bash server/scripts/server-cron/zaloha-konfigurace.sh > /dev/null

          if [ ! -f "$ARCHIV" ]; then
            echo "::error::Retence smazala jedinou kopii konfigurace."
            exit 1
          fi
          echo "✓ 60 dní stará jediná kopie přežila"

      - name: Prázdná nebo chybějící konfigurace se nevydává za zálohu
        run: |
          set -euo pipefail
          PRAC=$(mktemp -d)
          printf 'dostatecne-dlouhe-testovaci-heslo-nad-dvacet-znaku\n' > "$PRAC/heslo"

          : > "$PRAC/prazdny"
          if NEXUS_ZALOHA_HESLO="$PRAC/heslo" NEXUS_ENV_SOUBOR="$PRAC/prazdny" \
             NEXUS_BACKUP_DIR="$PRAC/zalohy" \
             bash server/scripts/server-cron/zaloha-konfigurace.sh 2>/dev/null; then
            echo "::error::Prázdné .env prošlo jako platná záloha."
            exit 1
          fi

          if NEXUS_ZALOHA_HESLO="$PRAC/heslo" NEXUS_ENV_SOUBOR="$PRAC/neexistuje" \
             NEXUS_BACKUP_DIR="$PRAC/zalohy" \
             bash server/scripts/server-cron/zaloha-konfigurace.sh 2>/dev/null; then
            echo "::error::Chybějící .env prošlo jako platná záloha."
            exit 1
          fi
          echo "✓ prázdná ani chybějící konfigurace neprojde"

  # ── Android Relay field test (post-deploy liveness check) ─────────────────────
  relay-field-test:
    name: Android Relay Field Test
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    if: >
      github.ref == 'refs/heads/master' &&
      github.event_name == 'push' &&
      vars.RELAY_FIELD_TEST_ENABLED == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Wait for backend to stabilize
        run: sleep 20

      - name: Run relay field test
        run: bash scripts/relay-field-test.sh
        env:
          # Relay phone identity — no Bearer token, only installationId + secret
          #
          # Přípona /api je tady schválně. Secret API_BASE_URL se drží BEZ ní,
          # protože rozvoz APK výš i backend (vultrRoutes.js) si /api dopisují
          # sami. Tenhle skript a audit-operational-health.js ho naopak čekají
          # jako součást adresy. Dopsáním tady se obě skupiny spotřebitelů
          # přestanou hádat o jednu hodnotu.
          #
          # relay-field-test.sh od 3. 11. 2026 BEZ téhle proměnné skončí
          # s kódem 2. Dřív měl zapsanou výchozí adresu na zaniklý server,
          # takže se tvářil, že má kam volat.
          API_BASE_URL:            ${{ secrets.API_BASE_URL }}/api
          RELAY_INSTALLATION_ID:   ${{ secrets.RELAY_INSTALLATION_ID }}
          RELAY_PROFILE_ID:        ${{ secrets.RELAY_PROFILE_ID }}
          DEVICE_SECRET:           ${{ secrets.NEXUS_DEVICE_SECRET }}
          CALLER_PHONE:            ${{ vars.RELAY_TEST_CALLER_PHONE || '+420000000001' }}
          FIELD_TEST_STRICT:       'true'
          # Optional: operator/manager read-only access to verify DB persistence
          RELAY_CHECKER_EMAIL:     ${{ secrets.RELAY_CHECKER_EMAIL }}
          RELAY_CHECKER_PASSWORD:  ${{ secrets.RELAY_CHECKER_PASSWORD }}

      - name: Run strict operational health smoke
        run: node server/scripts/audit-operational-health.js
        env:
          # Totéž co výš: skript čeká adresu včetně /api, secret ji nemá.
          OPS_API_BASE_URL:           ${{ secrets.API_BASE_URL }}/api
          # App Owner login for /admin/operational-health (admin endpoint)
          OPS_OWNER_EMAIL:            ${{ secrets.TEST_OWNER_EMAIL }}
          OPS_OWNER_PASSWORD:         ${{ secrets.TEST_OWNER_PASSWORD }}
          # Relay phone identity for relay-specific checks (no manager token)
          OPS_RELAY_PROFILE_ID:       ${{ secrets.RELAY_PROFILE_ID }}
          OPS_RELAY_INSTALLATION_ID:  ${{ secrets.RELAY_INSTALLATION_ID }}
          OPS_DEVICE_SECRET:          ${{ secrets.NEXUS_DEVICE_SECRET }}
          OPS_SMOKE_CALLER:           ${{ vars.RELAY_TEST_CALLER_PHONE || '+420000000001' }}
          OPS_MAX_MESSAGE_AGE_DAYS:   '7'
          STRICT_OPERATIONAL_HEALTH:  'true'

  # Pojistka, která se tiše přeskočí, není pojistka.
  #
  # relay-field-test se neprovede ze tří důvodů a všechny tři vypadají
  # v přehledu běhu stejně nevinně — jako „skipped":
  #   1. RELAY_FIELD_TEST_ENABLED není 'true' (dnes v repozitáři není ani
  #      jedna proměnná, takže je vypnutý);
  #   2. chybí secrety, které potřebuje — po zapnutí by spadl na preflightu
  #      v scripts/relay-field-test.sh;
  #   3. spadl deploy-backend, na kterém visí.
  #
  # Tahle úloha proto na deploy-backend SCHVÁLNĚ nezávisí: kdyby na něm
  # visela, mlčela by přesně v těch situacích, kvůli kterým vznikla.
  #
  # Nezhazuje build. Jestli terénní test zapnout a dodat mu údaje, je
  # rozhodnutí člověka — tahle úloha jen zajišťuje, aby se to rozhodovalo
  # vědomě, a ne mlčením.
  relay-field-test-stav:
    name: Relay Field Test — stav pojistky
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      # Secrety se testují jen na prázdnotu (secrets.X != ''), takže se do
      # logu nedostane žádná hodnota — ani zamaskovaná.
      - name: Je terénní test vyzbrojený?
        env:
          ZAPNUTO:     ${{ vars.RELAY_FIELD_TEST_ENABLED }}
          MA_API:      ${{ secrets.API_BASE_URL != '' }}
          MA_SECRET:   ${{ secrets.NEXUS_DEVICE_SECRET != '' }}
          MA_INSTAL:   ${{ secrets.RELAY_INSTALLATION_ID != '' }}
          MA_PROFIL:   ${{ secrets.RELAY_PROFILE_ID != '' }}
          MA_OWNER_M:  ${{ secrets.TEST_OWNER_EMAIL != '' }}
          MA_OWNER_P:  ${{ secrets.TEST_OWNER_PASSWORD != '' }}
        run: |
          CHYBI=""
          [ "$MA_API"     = "true" ] || CHYBI="$CHYBI API_BASE_URL"
          [ "$MA_SECRET"  = "true" ] || CHYBI="$CHYBI NEXUS_DEVICE_SECRET"
          [ "$MA_INSTAL"  = "true" ] || CHYBI="$CHYBI RELAY_INSTALLATION_ID"
          [ "$MA_PROFIL"  = "true" ] || CHYBI="$CHYBI RELAY_PROFILE_ID"
          [ "$MA_OWNER_M" = "true" ] || CHYBI="$CHYBI TEST_OWNER_EMAIL"
          [ "$MA_OWNER_P" = "true" ] || CHYBI="$CHYBI TEST_OWNER_PASSWORD"

          echo "### Relay Field Test — stav pojistky" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "$ZAPNUTO" = "true" ] && [ -z "$CHYBI" ]; then
            echo "Vyzbrojená: proměnná zapnutá a všechny potřebné secrety nastavené." >> "$GITHUB_STEP_SUMMARY"
            echo "OK: terénní test je vyzbrojený."
            exit 0
          fi

          echo "**Neprovede se.** Přeposílání na relay telefonu tedy po tomhle nasazení nikdo neověří." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "$ZAPNUTO" != "true" ]; then
            echo "- Vypnutý: \`RELAY_FIELD_TEST_ENABLED\` není \`true\` (teď: \`${ZAPNUTO:-nenastaveno}\`)." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Relay field test je vypnutý (RELAY_FIELD_TEST_ENABLED != true) — přeposílání na telefonu nic nehlídá."
          fi

          if [ -n "$CHYBI" ]; then
            echo "- Chybí secrety:$CHYBI" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Relay field testu chybí secrety:$CHYBI — i po zapnutí by spadl na preflightu."
          fi


