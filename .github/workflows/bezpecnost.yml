name: Bezpečnostní kontrola

# Nezávislá na placených doplňcích GitHubu a na cizích aplikacích.
#
# PROČ TAKHLE: alternativou byly nativní funkce GitHubu (CodeQL, Dependabot)
# nebo aplikace z marketplace. Obojí má háček:
#
#   - CodeQL a secret scanning jsou u SOUKROMÝCH repozitářů placené doplňky
#     účtované za každého, kdo pushuje. A o viditelnosti tohohle repozitáře
#     se teprve rozhoduje, viz docs/jak-neprijit-o-server.md.
#   - Aplikace z marketplace (CodeRabbit a spol.) jsou skutečné pluginy:
#     cizí firma dostane oprávnění číst repozitář. U kódu s licencí
#     „PROPRIETARY — All Rights Reserved" je to rozhodnutí jiné váhy.
#
# Tohle běží celé ve vlastním CI. Nikdo zvenčí nedostává přístup ke kódu,
# stojí to stejně nic u veřejného i soukromého repozitáře a při odchodu
# z GitHubu to jde s vámi — na rozdíl od nativních funkcí.
#
# POZOR, CO TO NENAHRAZUJE:
#   - `semgrep` s otevřenými pravidly NENÍ rovnocenná náhrada CodeQL.
#     Najde dost, ale hlubokou analýzu toku dat nedělá stejně dobře.
#   - Blokování pushe s tajemstvím nahradit nejde vůbec. To musí vynutit
#     GitHub na své straně, protože se to děje dřív, než cokoli dorazí do CI.
#     Tahle kontrola tajemství najde, ale až když už je v historii — a odtud
#     se nemaže.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: bezpecnost-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kontrola:
    name: Bezpečnostní kontrola
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Na úrovni úlohy, ne kroku: klíč cache níž je potřebuje taky.
    env:
      # Pevná verze: nástroj, který se sám aktualizuje, mění výsledky
      # mezi běhy a pak není poznat, jestli přibyl nález, nebo pravidlo.
      GITLEAKS_VERZE: '8.18.4'
      # Kontrolní součet ROZBALENÉ binárky (ne archivu). Ověřeno proti
      # `gitleaks_8.18.4_checksums.txt` z téhož vydání: součet archivu
      # souhlasí s tím, co vydává upstream, a tahle hodnota je z něj.
      # Při zvednutí verze se MUSÍ zvednout i tohle, jinak krok spadne
      # na nesouhlasu součtu — což je záměr, ne nehoda.
      GITLEAKS_SHA256: '46a05260e7cce527f132cb618de59d22262b8b5eb47f66c288447b95c7a98b7e'
    steps:
      - uses: actions/checkout@v4
        with:
          # Celá historie je nutná: gitleaks prohledává commity, ne jen
          # pracovní strom. Právě tím doplňuje scripts/check-secrets.js,
          # který se dívá jen na soubory, jak vypadají teď.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Vlastní Python, ne systémový. Systémový je na dnešních obrazech Ubuntu
      # chráněný (PEP 668) a `pip install` do něj skončí chybou
      # „externally-managed-environment".
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── 1. Zranitelné závislosti ────────────────────────────────────────
      #
      # Zvlášť nad každým package-lock.json. Stromy závislostí jsou oddělené,
      # jeden společný výsledek neexistuje. `npm audit` čte zámkový soubor,
      # takže nic není potřeba instalovat.
      - name: Zranitelné závislosti
        continue-on-error: true
        run: |
          mkdir -p vysledky/audit
          for KDE in . server client local-agent; do
            [ -f "$KDE/package-lock.json" ] || continue
            NAZEV=$([ "$KDE" = "." ] && echo "root" || basename "$KDE")
            echo "── $NAZEV ──"
            # `|| true`: npm audit vrací nenulu, když něco najde. To je
            # očekávaný stav, ne chyba běhu — o tom, co je ještě přijatelné,
            # rozhoduje souhrn níž, ne návratový kód nástroje.
            (cd "$KDE" && npm audit --json 2>/dev/null) > "vysledky/audit/$NAZEV.json" || true
            # Prázdný soubor by souhrn označil jako „nedoběhlo", což je
            # správně: znamenalo by to, že audit vůbec nic nevypsal.
            if [ ! -s "vysledky/audit/$NAZEV.json" ]; then
              echo "::warning::npm audit pro $NAZEV nevypsal nic."
            fi
          done

      # ── 2. Tajemství v historii ─────────────────────────────────────────
      # ── TOHLE UŽ BLOKUJE, na rozdíl od ostatních kontrol ─────────────────
      #
      # Ostatní kroky jen měří, protože jejich výchozí stav není uklizený.
      # U tajemství je od 5. 11. 2026 uklizený: z 19 nálezů bylo 17 planých
      # poplachů a všechny jsou rozebrané v `.gitleaks.toml`. Zbytek jsou
      # klíče Firebase, které do aplikace patří.
      #
      # Od téhle chvíle tedy každý NOVÝ nález znamená buď skutečné tajemství
      # v historii, nebo chybějící odůvodněnou výjimku. Obojí je důvod běh
      # zastavit — tajemství v historii se nedá smazat a každá hodina navíc
      # je hodina, kdy je venku.
      #
      # Taky se nespouští na pozadí: ani jeden z těch dvou kroků nemá
      # `continue-on-error`, takže když se nástroj nepodaří připravit nebo
      # spustit, běh SPADNE. Bezpečnostní kontrola, která tiše neproběhla,
      # je horší než žádná, protože vypadá jako zelená.

      # ── Nástroj z cache, ne ze sítě při každém běhu ──────────────────────
      #
      # Důvod je provozní: 8. 11. 2026 stahování spadlo na
      # `curl: (56) Connection died, tried 5 times before giving up` a brána
      # správně zavřela — jenže tím se kvůli výpadku cizí sítě nedalo sloučit
      # vůbec nic. Fail-closed zůstává (výpadek NEJDE obejít přeskočením
      # kontroly), ubývá jen těch stahování.
      #
      # POZOR, cache je úložiště, DO KTERÉHO SE DÁ ZAPSAT z jiné větve téhož
      # repozitáře. Kdyby se do ní podstrčila binárka, která jen vrátí nulu,
      # kontrola tajemství by hlásila čisto a nepoznal by to nikdo — tedy
      # přesně to tiché selhání, kterému se celá tahle úloha vyhýbá. Proto se
      # nástroj po obnovení z cache VŽDY ověřuje proti pevnému kontrolnímu
      # součtu a při nesouhlasu se stahuje znovu. Je to zároveň pojistka,
      # kterou úloha dřív neměla vůbec: neprojde ani podstrčený archiv
      # z Releases.
      #
      # Nástroj leží v `$RUNNER_TEMP`, ne v pracovním stromu. Gitleaks
      # v režimu `--no-git` prohledává `.`, takže by jinak prohledával sám
      # sebe.
      - name: Cache nástroje gitleaks
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nastroje
          # V klíči je verze i součet: po zvednutí verze se stará položka
          # nepoužije, místo aby tiše zůstala ležet.
          key: gitleaks-${{ env.GITLEAKS_VERZE }}-${{ env.GITLEAKS_SHA256 }}-linux-x64

      - name: Připravit gitleaks
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/nastroje"
          CIL="$RUNNER_TEMP/nastroje/gitleaks"

          overit() {
            [ -x "$1" ] || return 1
            echo "${GITLEAKS_SHA256}  $1" | sha256sum --check --status
          }

          if overit "$CIL"; then
            echo "Gitleaks je v cache a kontrolní součet souhlasí, nestahuje se."
            exit 0
          fi

          if [ -e "$CIL" ]; then
            echo "::warning::Gitleaks z cache NESOUHLASÍ s očekávaným součtem. Zahazuji ho a stahuji znovu."
            rm -f "$CIL"
          fi

          # Stahuje se jinam a na cílové místo se nástroj přesune TEPRVE po
          # ověření. Kdyby se psalo přímo do cesty, kterou ukládá cache,
          # uložila by se i binárka z nepodařeného běhu.
          STAZ="$(mktemp -d)"
          # Opakování NENÍ ozdoba. Obě selhání, která tuhle úlohu zavřela,
          # byla přechodná a obě by opakování přežilo:
          #
          #   8. 11. 2026  curl: (56) Connection died
          #   9. 11. 2026  curl: (22) The requested URL returned error: 504
          #
          # To druhé bylo PRVNÍ nasazení cache na masteru, kde cache z větve
          # PR nelze použít, takže se stahovat muselo. Cache tedy snižuje, jak
          # často se na síť sahá, ale první sáhnutí nezachrání — a právě to
          # dělá tohle.
          #
          # `--retry-all-errors`, protože 504 je sice v základní sadě
          # opakovatelných chyb, ale (56) ne. Cenou je, že i trvalá chyba
          # (třeba 404 u překlepnuté verze) se zkouší celou minutu, než krok
          # spadne. To je snesitelné: trvalá chyba znamená chybu v této
          # úloze, a tu je potřeba si všimnout, ne ji mít rychle.
          curl -sSfL \
            --connect-timeout 15 \
            --retry 6 --retry-delay 5 --retry-all-errors --retry-max-time 180 \
            -o "$STAZ/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERZE}/gitleaks_${GITLEAKS_VERZE}_linux_x64.tar.gz" \
            || { echo "::error::Gitleaks se nepodařilo stáhnout ani po opakování — kontrola tajemství NEPROBĚHLA."; exit 1; }
          tar -xzf "$STAZ/gitleaks.tar.gz" -C "$STAZ" gitleaks \
            || { echo "::error::Archiv gitleaks nejde rozbalit — kontrola tajemství NEPROBĚHLA."; exit 1; }
          chmod +x "$STAZ/gitleaks"

          overit "$STAZ/gitleaks" \
            || { echo "::error::Stažený gitleaks NEODPOVÍDÁ očekávanému součtu ${GITLEAKS_SHA256} — kontrola tajemství NEPROBĚHLA."; exit 1; }

          mv "$STAZ/gitleaks" "$CIL"
          echo "Gitleaks stažen a ověřen."

      - name: Tajemství v historii gitu
        run: |
          set -uo pipefail
          mkdir -p vysledky

          # ── Proč to není prostě „prohledej celou historii" ──────────────
          #
          # První pokus tohle dělal a RUNNERU DOŠLA PAMĚŤ — běh byl zabit po
          # 3 minutách 51 vteřinách, ne vyčerpáním časového limitu.
          #
          # Důvod: v historii tohohle repozitáře leží commitnutá npm cache.
          # `git count-objects` hlásí 345 MB a mezi největšími objekty jsou
          # balíky po 64, 41 a 36 MB plus 34MB client/lint_results.txt.
          # Gitleaks je zkoušel dekódovat všechny.
          #
          # `--max-target-megabytes 5` proto velké soubory přeskakuje. Tajemství
          # se do šedesátimegabajtového archivu balíčku nepíšou.
          #
          # A historie se znovu neprohledává při každém PR. Staré commity se
          # nemění, takže opakovaný průchod 1 409 commity je jen placený čas:
          #
          #   - v PR   → jen pracovní strom (--no-git), rychlé a ohraničené
          #   - master → celá historie, kde na to je prostor
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            ROZSAH="--no-git"
            echo "Režim: jen pracovní strom (PR)."
          else
            ROZSAH=""
            echo "Režim: celá historie (master)."
          fi

          # `--redact` je POVINNÉ, ne volitelné: logy běhů veřejného
          # repozitáře vidí kdokoli. Bez toho by nástroj na hledání tajemství
          # sám tajemství zveřejnil.
          #
          # `--config .gitleaks.toml` nese odůvodněné výjimky. Každá je tam
          # vypsaná i s tím, proč ten nález není skutečný.
          #
          # `--exit-code 1`: nález teď běh ZASTAVÍ. Viz komentář u kroku výš.
          # shellcheck disable=SC2086
          "$RUNNER_TEMP/nastroje/gitleaks" detect \
            --config .gitleaks.toml \
            --source . \
            $ROZSAH \
            --max-target-megabytes 5 \
            --redact \
            --report-format json \
            --report-path vysledky/gitleaks.json \
            --exit-code 1 \
            || {
              echo "::error::Gitleaks našel tajemství, nebo skončil chybou. Podrobnosti v artefaktu."
              echo "Když je nález planý poplach, přidej ho do .gitleaks.toml i s odůvodněním."
              exit 1
            }

          # ── Kolik se toho vůbec neprohlédlo ───────────────────────────────
          #
          # `--max-target-megabytes 5` velké soubory přeskakuje a NEŘEKNE TO.
          # Bez tohohle řádku by krok hlásil čisto i ve chvíli, kdy desítky
          # megabajtů v historii nikdo neotevřel — tedy přesně ten druh
          # tichého selhání, kvůli kterému tahle úloha vznikla.
          #
          # V historii leží commitnutá npm cache s objekty po 64, 41 a 36 MB.
          # `%(rest)` je nutné: `git rev-list --objects` dává řádky „sha cesta"
          # a bez něj by `cat-file` bral celý řádek jako jméno objektu, nic
          # nenašel a tiše hlásil nulu. Ověřeno — první verze přesně tohle dělala.
          VELKE=$(git rev-list --objects --all 2>/dev/null \
            | git cat-file --batch-check='%(objecttype) %(objectsize) %(rest)' 2>/dev/null \
            | awk '$1=="blob" && $2 > 5242880' | wc -l | tr -d ' ')
          if [ "${VELKE:-0}" -gt 0 ]; then
            echo "::warning::Kvůli limitu 5 MB se neprohlédlo ${VELKE} objektů v historii. Čistý výsledek platí JEN mimo ně."
          fi

      # ── 3. Statická analýza ─────────────────────────────────────────────
      - name: Statická analýza kódu
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p vysledky
          python3 -m pip install --quiet semgrep \
            || { echo "::warning::Semgrep se nepodařilo nainstalovat."; exit 0; }

          # `--metrics=off`: bez toho posílá semgrep telemetrii o repozitáři
          # na své servery. Celý smysl téhle úlohy je, že nic neodchází.
          #
          # Pravidla jsou pojmenovaná výslovně, ne `--config=auto`. Auto
          # posílá metadata repozitáře, aby si vybralo samo.
          semgrep scan \
            --config p/javascript \
            --config p/security-audit \
            --metrics=off \
            --json --output vysledky/semgrep.json \
            --quiet || echo "::warning::Semgrep skončil chybou."

      # ── Souhrn ──────────────────────────────────────────────────────────
      #
      # Rozlišuje „nic jsem nenašel" od „nástroj vůbec neběžel". Chybějící
      # report hlásí jako chybu, ne jako čistý výsledek — nástroj, který se
      # tiše nespustil, by jinak vypadal jako dobrá zpráva.
      - name: Souhrn do shrnutí úlohy
        if: always()
        continue-on-error: true
        run: |
          node scripts/souhrn-bezpecnosti.js \
            vysledky/audit \
            vysledky/gitleaks.json \
            vysledky/semgrep.json >> "$GITHUB_STEP_SUMMARY"

      # Podrobnosti k nálezům. Hodnoty tajemství jsou díky `--redact`
      # začerněné i tady.
      # `if-no-files-found: warn` a `continue-on-error`: kdyby ani jedna
      # kontrola nic nevyprodukovala, nahrávání artefaktu by samo shodilo
      # úlohu — a v souhrnu by přitom stálo srozumitelné „nedoběhlo".
      # Diagnostika má být ve shrnutí, ne v pádu kroku, který jen ukládá.
      - name: Uložit podrobné výsledky
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: bezpecnostni-kontrola
          path: vysledky/
          if-no-files-found: warn
          retention-days: 14

      # ── Co blokuje a co zatím jen měří ──────────────────────────────────
      #
      # Tajemství BLOKUJÍ: jejich výchozí stav je rozebraný a odůvodněné
      # výjimky jsou v `.gitleaks.toml`.
      #
      # Závislosti a statická analýza zatím jen MĚŘÍ. Jejich výchozí stav
      # uklizený není a brána, která je červená pořád, skončí jedním ze dvou
      # způsobů: buď se vypne, nebo se na červenou přestane koukat.
      #
      # Tenhle krok dřív tiskl „úloha záměrně neshazuje" — od chvíle, kdy
      # tajemství blokují, to byla nepravda na posledním řádku logu, tedy
      # přesně tam, kam se kouká.
      - name: Verdikt
        if: always()
        run: |
          echo "Kontrola proběhla. Výsledky jsou ve shrnutí úlohy a v artefaktu."
          echo ""
          echo "BLOKUJE:   tajemství v historii (gitleaks)"
          echo "jen měří:  zranitelné závislosti, statická analýza"
          echo ""
          echo "Zelená u měřicích kroků NENÍ důkaz, že nic nenašly — čísla jsou ve shrnutí."
